<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Christy Frink</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✌️</text></svg>">
  <meta name="description" content="Christy Frink — product manager, community advocate, civic transparency researcher. Baltimore." />
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #29c9be;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Fira Code', 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      background: #ffffff;
      color: #111;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
      padding: 24px;
    }

    /* ── Glitch photo ───────────────────────── */

    .glitch {
      position: relative;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
    }

    .glitch img {
      width: 170px;
      height: 170px;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 1;
    }

    .glitch::before,
    .glitch::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url('assets/christy.JPG');
      background-size: cover;
      background-position: center;
      opacity: 0;
      z-index: 2;
    }

    .glitch::before { filter: hue-rotate(90deg) saturate(3); }
    .glitch::after  { filter: hue-rotate(200deg) saturate(3); }

    .glitch:hover::before {
      opacity: 0.75;
      animation: glitch-clip-1 1.6s steps(1) infinite;
    }

    .glitch:hover::after {
      opacity: 0.75;
      animation: glitch-clip-2 1.6s steps(1) infinite;
    }

    .glitch:hover img {
      animation: glitch-shift 1.4s steps(1) infinite;
    }

    @keyframes glitch-shift {
      0%   { transform: translateX(0); }
      20%  { transform: translateX(-3px); }
      22%  { transform: translateX(0); }
      45%  { transform: translateX(2px); }
      47%  { transform: translateX(0); }
      71%  { transform: translateX(-2px); }
      73%  { transform: translateX(0); }
      88%  { transform: translateX(3px); }
      90%  { transform: translateX(0); }
      100% { transform: translateX(0); }
    }

    @keyframes glitch-clip-1 {
      0%  { clip-path: inset(0 0 100% 0);  transform: translateX(0); }
      22% { clip-path: inset(11% 0 87% 0); transform: translateX(-7px); }
      25% { clip-path: inset(0 0 100% 0);  transform: translateX(0); }
      39% { clip-path: inset(64% 0 32% 0); transform: translateX(5px); }
      41% { clip-path: inset(38% 0 61% 0); transform: translateX(-6px); }
      43% { clip-path: inset(0 0 100% 0);  transform: translateX(0); }
      66% { clip-path: inset(79% 0 19% 0); transform: translateX(8px); }
      68% { clip-path: inset(52% 0 46% 0); transform: translateX(-5px); }
      71% { clip-path: inset(0 0 100% 0);  transform: translateX(0); }
      91% { clip-path: inset(5% 0 93% 0);  transform: translateX(6px); }
      94% { clip-path: inset(0 0 100% 0);  transform: translateX(0); }
      100%{ clip-path: inset(0 0 100% 0);  transform: translateX(0); }
    }

    @keyframes glitch-clip-2 {
      0%  { clip-path: inset(100% 0 0 0);  transform: translateX(0); }
      17% { clip-path: inset(28% 0 69% 0); transform: translateX(8px); }
      19% { clip-path: inset(72% 0 26% 0); transform: translateX(-6px); }
      21% { clip-path: inset(100% 0 0 0);  transform: translateX(0); }
      41% { clip-path: inset(48% 0 50% 0); transform: translateX(5px); }
      44% { clip-path: inset(100% 0 0 0);  transform: translateX(0); }
      69% { clip-path: inset(16% 0 82% 0); transform: translateX(-7px); }
      71% { clip-path: inset(85% 0 13% 0); transform: translateX(6px); }
      74% { clip-path: inset(100% 0 0 0);  transform: translateX(0); }
      92% { clip-path: inset(43% 0 55% 0); transform: translateX(-8px); }
      96% { clip-path: inset(100% 0 0 0);  transform: translateX(0); }
      100%{ clip-path: inset(100% 0 0 0);  transform: translateX(0); }
    }

    /* ── Text ───────────────────────────────── */

    .info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .name {
      font-size: 26px;
      font-weight: 500;
      letter-spacing: -0.3px;
    }

    .tagline {
      font-size: 12px;
      color: #888;
      line-height: 1.6;
    }

    .contact {
      display: inline-block;
      margin-top: 4px;
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
    }

    .contact:hover { text-decoration: underline; }

    .contact:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    @media (hover: none) {
      .glitch::before {
        opacity: 0.75;
        animation: glitch-clip-1 1.6s steps(1) infinite;
      }
      .glitch::after {
        opacity: 0.75;
        animation: glitch-clip-2 1.6s steps(1) infinite;
      }
      .glitch img {
        animation: glitch-shift 1.4s steps(1) infinite;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .glitch::before,
      .glitch::after,
      .glitch img,
      .glitch:hover::before,
      .glitch:hover::after,
      .glitch:hover img {
        animation: none;
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="glitch">
      <img src="assets/christy.JPG" alt="Christy Frink" />
    </div>
    <div class="info">
      <div class="name">Christy Frink</div>
      <div class="tagline">📍 baltimore</div>
      <div class="tagline">product management ✺ community advocate</div>
      <div class="tagline">data privacy // tech accountability // AI safety // civic transparency</div>
      <a class="contact" href="mailto:info@christyfrink.com">get in touch</a>
    </div>
  </div>
</body>
</html>
